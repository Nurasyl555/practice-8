<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070913" />
    <title>Офлайн-режим — CosmoDex</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #070913;
        background-image:
          radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
          radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.12) 0%, transparent 45%);
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
      }
      .offline-card {
        width: 100%;
        max-width: 520px;
        background: rgba(18, 24, 43, 0.88);
        border: 1px solid rgba(79, 110, 180, 0.35);
        border-radius: 22px;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .icon-badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.35);
        color: #fbbf24;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: rgba(244, 63, 94, 0.14);
        border: 1px solid rgba(244, 63, 94, 0.35);
        color: #fda4af;
        border-radius: 999px;
        padding: 0.3rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: clamp(1.45rem, 4.5vw, 1.9rem);
        font-weight: 800;
        margin-bottom: 0.75rem;
        line-height: 1.2;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.7rem 1.25rem;
        border-radius: 10px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: linear-gradient(135deg, #6366f1, #38bdf8);
        color: #fff;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(79, 110, 180, 0.35);
        color: #f1f5f9;
      }
      .feedback {
        margin-top: 1rem;
        font-size: 0.85rem;
        color: #94a3b8;
        min-height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="icon-badge" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" x2="22" y1="2" y2="22"></line>
          <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path>
          <line x1="12" x2="12.01" y1="20" y2="20"></line>
        </svg>
      </div>
      <div class="status-pill">Нет подключения к сети</div>
      <h1>Связь с орбитой потеряна</h1>
      <p>
        Эта страница недоступна без интернета, так как ещё не была сохранена в кэше.
        Проверьте подключение или откройте главную страницу и ранее посещённый каталог экзопланет.
      </p>
      <div class="actions">
        <button id="retry-btn" class="btn btn-primary" type="button">
          Повторить подключение
        </button>
        <a class="btn btn-secondary" href="./">На главную</a>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </main>

    <script>
      const retryBtn = document.getElementById("retry-btn");
      const feedback = document.getElementById("feedback");

      async function tryReconnect() {
        retryBtn.disabled = true;
        feedback.textContent = "Проверка подключения...";
        try {
          const res = await fetch("./manifest.json?ping=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            feedback.textContent = "Соединение восстановлено! Перезагрузка...";
            window.location.reload();
            return;
          }
          throw new Error("Offline");
        } catch {
          feedback.textContent = "Подключение всё ещё отсутствует. Попробуйте позже.";
          retryBtn.disabled = false;
        }
      }

      retryBtn.addEventListener("click", tryReconnect);
      window.addEventListener("online", () => window.location.reload());
    </script>
  </body>
</html>
